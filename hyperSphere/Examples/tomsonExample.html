<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Tomson example</title>
</head>
<body>
    <script type="module">
        //https://gemini.google.com/app/f6d58fd7a1e2e1bf
		// ETA_0 — базовый коэффициент скорости обучения / шага градиентного спуска (Learning Rate).
		// Определяет, насколько сильно точки смещаются под действием сил отталкивания за один шаг.
		//
		// Допустимый диапазон:
		// - Рекомендуемый: от 0.001 до 0.05.
		// - Слишком малое (< 0.0001): система будет сходиться крайне медленно (потребуются тысячи итераций).
		// - Слишком большое (> 0.1): точки начнут «перелетать» оптимальные положения, вызывая осцилляции и нестабильность.
		const ETA_0 = 0.01;

		// BETA — коэффициент сохранения импульса (затухания инерции).
		// Определяет, какая доля скорости с прошлого шага сохраняется на текущем.
		//
		// Минимальное значение: 0.0
		// - Полное отсутствие инерции (классический градиентный спуск).
		// Максимальное значение: < 1.0 (обычно до 0.99)
		// - Чем ближе к 1.0, тем сильнее инерция и «тяжелее» точки.
		// - BETA = 0.85–0.90: умеренно сильная инерция, ускоряет преодоление плато и помогает проходить локальные минимумы.
		// - BETA >= 0.99: запредельная инерция, точки начинают бесконечно осциллировать и долго «раскачиваться».
		const BETA = 0.85;

		const rMin = 0.1; // Минимальный радиус
		const rMax = 1.0; // Максимальный радиус

		// Плоский массив 4D координат точек [x0, y0, z0, w0, x1, y1, z1, w1, ...]
		// Соответствует структуре bufferGeometry.attributes.position.array
		// Координаты скопированы из строки sPositionArray в файле D:\My documents\MyProjects\webgl\three.js\GitHub\universe\main\hyperSphere\Examples\tomsonExample.html
		const positionArray = new Float32Array([
			-0.02587701566517353, 0.0675637423992157, -0.05302936211228371, 0.04419736936688423,
			-0.016921283677220345, -0.054973144084215164, -0.014062980189919472, -0.08058446645736694,
			0.003661202499642968, -0.014033776707947254, -0.051428329199552536, 0.08452677726745605,
			-0.03790852054953575, 0.0704442486166954, 0.04782545194029808, 0.03623918071389198,
			0.004120172467082739, 0.042841169983148575, 0.016064807772636414, -0.08882331103086472,
		]);

		/**
		 * Проверка принадлежности точек из глобального positionArray гиперсфере заданной с определенной точностью
		 */
		function verifyHyperSphere(targetRadius, epsilon = 1e-6) {
			const totalPoints = positionArray.length / 4;
			for (let i = 0; i < totalPoints; i++) {
				const idx = i * 4;
				const x = positionArray[idx];
				const y = positionArray[idx + 1];
				const z = positionArray[idx + 2];
				const w = positionArray[idx + 3];

				const dist = Math.hypot(x, y, z, w);
				if (Math.abs(dist - targetRadius) > epsilon) {
					console.warn(`Точка #${i} отклонилась от гиперсферы! R = ${dist}, ожидалось = ${targetRadius}`);
					return false;
				}
			}
			return true;
		}

		// Запуск симуляции с динамическим шагом радиуса в глобальном positionArray
		function runThomsonMomentum(marks = 10) {
			const totalPoints = positionArray.length / 4; // Количество 4D точек

			// Проверка исходных точек на гиперсфере rMin
			console.log("Проверка начального массива positionArray...");
			if (!verifyHyperSphere(rMin)) {
				throw new Error("Ошибка: начальные точки не лежат на гиперсфере радиуса rMin");
			}
			console.log("Начальный массив успешно верифицирован!");

			// Выделяем память под скорости и силы (4 элемента на точку)
			const velocities = new Float32Array(positionArray.length);
			const forces = new Float32Array(positionArray.length);

			let currentR = rMin;

			console.log(`\n--- Старт симуляции (TimeId 0, R = ${currentR.toFixed(2)}) ---`);

			for (let timeId = 1; timeId <= marks - 1; timeId++) {
				const nextR = rMin + (rMax - rMin) * (timeId / (marks - 1));
				const rRatio = nextR / currentR;

				// 1. In-place масштабирование скоростей при изменении радиуса пространства
				for (let k = 0; k < velocities.length; k++) {
					velocities[k] *= rRatio;
				}

				const eta = ETA_0 * Math.pow(currentR, 3);
				forces.fill(0); // Сброс сил перед новым шагом

				// 2. Расчет Кулоновских сил отталкивания
				for (let i = 0; i < totalPoints - 1; i++) {
					const i4 = i * 4;
					const ix = positionArray[i4];
					const iy = positionArray[i4 + 1];
					const iz = positionArray[i4 + 2];
					const iw = positionArray[i4 + 3];

					for (let j = i + 1; j < totalPoints; j++) {
						const j4 = j * 4;

						const dx = ix - positionArray[j4];
						const dy = iy - positionArray[j4 + 1];
						const dz = iz - positionArray[j4 + 2];
						const dw = iw - positionArray[j4 + 3];

						const d2 = dx * dx + dy * dy + dz * dz + dw * dw;
						const dist = Math.sqrt(d2);

						const m = 1 / (d2 * dist);

						const fx = dx * m;
						const fy = dy * m;
						const fz = dz * m;
						const fw = dw * m;

						// Сила на точку i
						forces[i4] += fx;
						forces[i4 + 1] += fy;
						forces[i4 + 2] += fz;
						forces[i4 + 3] += fw;

						// Противоположная сила на точку j (3-й закон Ньютона)
						forces[j4] -= fx;
						forces[j4 + 1] -= fy;
						forces[j4 + 2] -= fz;
						forces[j4 + 3] -= fw;
					}
				}

				// 3. Обновление скоростей и позиций in-place прямо в глобальном positionArray
				for (let i = 0; i < totalPoints; i++) {
					const i4 = i * 4;

					// Обновление скорости (Momentum)
					velocities[i4] = BETA * velocities[i4] + eta * forces[i4];
					velocities[i4 + 1] = BETA * velocities[i4 + 1] + eta * forces[i4 + 1];
					velocities[i4 + 2] = BETA * velocities[i4 + 2] + eta * forces[i4 + 2];
					velocities[i4 + 3] = BETA * velocities[i4 + 3] + eta * forces[i4 + 3];

					// Смещение координаты
					const updatedX = positionArray[i4] + velocities[i4];
					const updatedY = positionArray[i4 + 1] + velocities[i4 + 1];
					const updatedZ = positionArray[i4 + 2] + velocities[i4 + 2];
					const updatedW = positionArray[i4 + 3] + velocities[i4 + 3];

					// Нормализация и проекция обратно на гиперсферу радиуса nextR
					const mag = Math.hypot(updatedX, updatedY, updatedZ, updatedW);

					positionArray[i4] = (updatedX / mag) * nextR;
					positionArray[i4 + 1] = (updatedY / mag) * nextR;
					positionArray[i4 + 2] = (updatedZ / mag) * nextR;
					positionArray[i4 + 3] = (updatedW / mag) * nextR;
				}

				currentR = nextR;

				// Проверка, что после шага все точки корректно спроецировались на новую гиперсферу
				if (!verifyHyperSphere(currentR)) {
					throw new Error(`Ошибка проекции точек на итерации ${timeId}`);
				}

				console.log(`\n=== Итерация ${timeId} / ${marks - 1} (R = ${currentR.toFixed(2)}) ===`);
				console.log("Модуль скорости первой точки (v0):", Math.hypot(velocities[0], velocities[1], velocities[2], velocities[3]).toExponential(4));

				// Разделение positionArray на отдельные точки и вывод их координат в консоль
				const updatedPoints = [];
				for (let i = 0; i < totalPoints; i++) {
					const i4 = i * 4;
					updatedPoints.push({
						x: positionArray[i4],
						y: positionArray[i4 + 1],
						z: positionArray[i4 + 2],
						w: positionArray[i4 + 3]
					});
				}
				console.log("Новые декартовы координаты всех точек:", updatedPoints);
			}
		}

		// Запуск симуляции
		runThomsonMomentum(10);
	</script>
</body>
</html>
