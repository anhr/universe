<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Tomson example</title>
</head>
<body>
    <script type="module">
        //https://gemini.google.com/app/f6d58fd7a1e2e1bf
		// ETA_0 — базовый коэффициент скорости обучения / шага градиентного спуска (Learning Rate).
		// Определяет, насколько сильно точки смещаются под действием сил отталкивания за один шаг.
		//
		// Допустимый диапазон:
		// - Рекомендуемый: от 0.001 до 0.05.
		// - Слишком малое (< 0.0001): система будет сходиться крайне медленно (потребуются тысячи итераций).
		// - Слишком большое (> 0.1): точки начнут «перелетать» оптимальные положения, вызывая осцилляции и нестабильность.
		const ETA_0 = 0.01;

		// BETA — коэффициент сохранения импульса (затухания инерции).
		// Определяет, какая доля скорости с прошлого шага сохраняется на текущем.
		//
		// Минимальное значение: 0.0
		// - Полное отсутствие инерции (классический градиентный спуск).
		// Максимальное значение: < 1.0 (обычно до 0.99)
		// - Чем ближе к 1.0, тем сильнее инерция и «тяжелее» точки.
		// - BETA = 0.85–0.90: умеренно сильная инерция, ускоряет преодоление плато и помогает проходить локальные минимумы.
		// - BETA >= 0.99: запредельная инерция, точки начинают бесконечно осциллировать и долго «раскачиваться».
		const BETA = 0.85;

		const rMin = 0.1; // Минимальный радиус
		const rMax = 1.0; // Максимальный радиус

		let pointsPolar = [
			{ altitude: 1.1129985826111568, latitude: -0.632505345630809, longitude: 1.9365635037696387 },
			{ altitude: 2.507896901828599, latitude: -0.2397907735261665, longitude: -1.8694027716053692 },
			{ altitude: 0.5637302656397968, latitude: -1.2959213159232201, longitude: -1.3155994406557945 },
			{ altitude: 1.1999634672996229, latitude: 0.5388326447188353, longitude: 2.064484572068206 },
			{ altitude: 2.664280909988919, latitude: 0.35724698446724523, longitude: 1.474918001829255 }
		];

		function polarToCartesian(angles, r) {
			const { altitude, latitude, longitude } = angles;
			const x = r * Math.sin(altitude) * Math.cos(latitude) * Math.cos(longitude);
			const y = r * Math.sin(altitude) * Math.cos(latitude) * Math.sin(longitude);
			const z = r * Math.sin(altitude) * Math.sin(latitude);
			const w = r * Math.cos(altitude);
			return { x, y, z, w };
		}

		function cartesianToPolar({ x, y, z, w }, r) {
			const altitude = Math.acos(Math.max(-1, Math.min(1, w / r)));
			const sinAlt = Math.sin(altitude);
			let latitude = 0;
			if (Math.abs(sinAlt) > 1e-12) {
				latitude = Math.asin(Math.max(-1, Math.min(1, z / (r * sinAlt))));
			}
			const longitude = Math.atan2(y, x);
			return { altitude, latitude, longitude };
		}

		// Запуск симуляции с динамическим шагом радиуса
		function runThomsonMomentum(initialPolarPoints, marks = 10) {
			const N = initialPolarPoints.length;

			// Инициализация векторов скоростей и декартовых координат с помощью const
			const velocities = Array.from({ length: N }, () => ({ x: 0, y: 0, z: 0, w: 0 }));
			let currentR = rMin;
			const cartesian = initialPolarPoints.map(p => polarToCartesian(p, currentR));

			console.log(`--- Старт симуляции (TimeId 0, R = ${currentR.toFixed(2)}) ---`);

			for (let timeId = 1; timeId <= marks - 1; timeId++) {
				const nextR = rMin + (rMax - rMin) * (timeId / (marks - 1));
				const rRatio = nextR / currentR;

				// In-place масштабирование скоростей без пересоздания массива
				for (let i = 0; i < N; i++) {
					velocities[i].x *= rRatio;
					velocities[i].y *= rRatio;
					velocities[i].z *= rRatio;
					velocities[i].w *= rRatio;
				}

				const eta = ETA_0 * Math.pow(currentR, 3);
				const forces = Array.from({ length: N }, () => ({ x: 0, y: 0, z: 0, w: 0 }));

				// 1. Расчет Кулоновских сил отталкивания
				for (let i = 0; i < N - 1; i++) {
					for (let j = i + 1; j < N; j++) {
						const dx = cartesian[i].x - cartesian[j].x;
						const dy = cartesian[i].y - cartesian[j].y;
						const dz = cartesian[i].z - cartesian[j].z;
						const dw = cartesian[i].w - cartesian[j].w;

						const d2 = dx * dx + dy * dy + dz * dz + dw * dw;
						const dist = Math.sqrt(d2);

						const m = 1 / (d2 * dist);

						const fx = dx * m;
						const fy = dy * m;
						const fz = dz * m;
						const fw = dw * m;

						forces[i].x += fx; forces[i].y += fy; forces[i].z += fz; forces[i].w += fw;
						forces[j].x -= fx; forces[j].y -= fy; forces[j].z -= fz; forces[j].w -= fw;
					}
				}

				// 2. Обновление скоростей и позиций in-place
				for (let i = 0; i < N; i++) {
					// Обновляем скорость v = BETA * v + eta * F
					velocities[i].x = BETA * velocities[i].x + eta * forces[i].x;
					velocities[i].y = BETA * velocities[i].y + eta * forces[i].y;
					velocities[i].z = BETA * velocities[i].z + eta * forces[i].z;
					velocities[i].w = BETA * velocities[i].w + eta * forces[i].w;

					// Временное смещение координаты
					const updatedX = cartesian[i].x + velocities[i].x;
					const updatedY = cartesian[i].y + velocities[i].y;
					const updatedZ = cartesian[i].z + velocities[i].z;
					const updatedW = cartesian[i].w + velocities[i].w;

					// Нормализация и проекция обратно на гиперсферу с радиусом nextR
					const mag = Math.hypot(updatedX, updatedY, updatedZ, updatedW);

					cartesian[i].x = (updatedX / mag) * nextR;
					cartesian[i].y = (updatedY / mag) * nextR;
					cartesian[i].z = (updatedZ / mag) * nextR;
					cartesian[i].w = (updatedW / mag) * nextR;
				}

				currentR = nextR;
				const currentPolar = cartesian.map(pt => cartesianToPolar(pt, currentR));

				console.log(`\n=== Итерация ${timeId} / ${marks - 1} (R = ${currentR.toFixed(2)}) ===`);
				console.log("Модуль скорости первой точки (v0):", Math.hypot(velocities[0].x, velocities[0].y, velocities[0].z, velocities[0].w).toExponential(4));
				console.log("Новые полярные координаты точки:", currentPolar);
			}
		}

		// Запуск симуляции
		runThomsonMomentum(pointsPolar, 10);
	</script>
</body>
</html>
