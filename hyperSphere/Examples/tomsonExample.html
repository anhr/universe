<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Tomson example</title>
</head>
<body>
    <script type="module">
        //https://gemini.google.com/app/f6d58fd7a1e2e1bf
		const R = 0.1;
		const REPULSION_STRENGTH = 1; // Изменено на 1
		const ETA_0 = 0.01;

		// Массив объектов точек вместо массивов
		const pointsPolar = [
			{ altitude: 1.1129985826111568, latitude: -0.632505345630809, longitude: 1.9365635037696387 },
			{ altitude: 2.507896901828599, latitude: -0.2397907735261665, longitude: -1.8694027716053692 },
			{ altitude: 0.5637302656397968, latitude: -1.2959213159232201, longitude: -1.3155994406557945 },
			{ altitude: 1.1999634672996229, latitude: 0.5388326447188353, longitude: 2.064484572068206 },
			{ altitude: 2.664280909988919, latitude: 0.35724698446724523, longitude: 1.474918001829255 }
		];

		// Принимает объект angles = { altitude, latitude, longitude } и возвращает объект { x, y, z, w }
		function polarToCartesian(angles, r = R) {
			const { altitude, latitude, longitude } = angles;
			const x = r * Math.sin(altitude) * Math.cos(latitude) * Math.cos(longitude);
			const y = r * Math.sin(altitude) * Math.cos(latitude) * Math.sin(longitude);
			const z = r * Math.sin(altitude) * Math.sin(latitude);
			const w = r * Math.cos(altitude);

			return { x, y, z, w };
		}

		// Принимает объект { x, y, z, w } и возвращает объект { altitude, latitude, longitude }
		function cartesianToPolar({ x, y, z, w }, r = R) {
			const altitude = Math.acos(Math.max(-1, Math.min(1, w / r)));
			const sinAlt = Math.sin(altitude);

			let latitude = 0;
			if (Math.abs(sinAlt) > 1e-12) {
				latitude = Math.asin(Math.max(-1, Math.min(1, z / (r * sinAlt))));
			}

			const longitude = Math.atan2(y, x);

			return { altitude, latitude, longitude };
		}

		// Из подписи функции удалены аргументы repulsion и eta0
		function thomsonStep4D(polarPoints, r = R) {
			// Динамический расчет ETA от радиуса
			const eta = ETA_0 * Math.pow(r, 3);

			// 1. Конвертация в Cartesian (получаем массив объектов {x, y, z, w})
			let cartesian = polarPoints.map(p => polarToCartesian(p, r));
			const N = cartesian.length;

			// Вектор сил для каждой точки в 4D
			const forces = Array.from({ length: N }, () => ({ x: 0, y: 0, z: 0, w: 0 }));

			// 2. Расчет кулоновских сил отталкивания
			for (let i = 0; i < N; i++) {
				for (let j = 0; j < N; j++) {
					if (i === j) continue;

					const dx = cartesian[i].x - cartesian[j].x;
					const dy = cartesian[i].y - cartesian[j].y;
					const dz = cartesian[i].z - cartesian[j].z;
					const dw = cartesian[i].w - cartesian[j].w;

					// Заменено distSq -> d2
					const d2 = dx * dx + dy * dy + dz * dz + dw * dw;
					const dist = Math.sqrt(d2);

					// Заменено factor -> m
					const m = REPULSION_STRENGTH / (d2 * dist);

					forces[i].x += dx * m;
					forces[i].y += dy * m;
					forces[i].z += dz * m;
					forces[i].w += dw * m;
				}
			}

			// 3. Смещение точек и нормализация на гиперсферу S3 (R)
			const newCartesian = cartesian.map((pt, i) => {
				const updated = {
					x: pt.x + eta * forces[i].x,
					y: pt.y + eta * forces[i].y,
					z: pt.z + eta * forces[i].z,
					w: pt.w + eta * forces[i].w
				};

				const mag = Math.hypot(updated.x, updated.y, updated.z, updated.w);

				return {
					x: (updated.x / mag) * r,
					y: (updated.y / mag) * r,
					z: (updated.z / mag) * r,
					w: (updated.w / mag) * r
				};
			});

			// 4. Возврат в полярную систему (массив объектов { altitude, latitude, longitude })
			return newCartesian.map(pt => cartesianToPolar(pt, r));
		}

		// Выполнение 1 шага
		const nextPolarPoints = thomsonStep4D(pointsPolar, R);
		console.log("Новые полярные координаты точек:", nextPolarPoints);
	</script>
</body>
</html>
