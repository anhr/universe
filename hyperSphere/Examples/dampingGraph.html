		//		const DEBUG_MODE = true;

		const setAttributes = (pointAngles, r, index) => {

		// --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ МАТЕМАТИКИ ---
		const polarToCartesian = (la, lo, al, r = 1) => {
			const r_xyz = r * Math.sin(al);
			return { x: r_xyz * Math.cos(la) * Math.cos(lo), y: r_xyz * Math.cos(la) * Math.sin(lo), z: r_xyz * Math.sin(la), w: r * Math.cos(al) };
		};
		const cartesianToPolar = (vertice) => {
			const x = vertice.x;
			const y = vertice.y;
			const z = vertice.z;
			const w = vertice.w;
			const xyz = x * x + y * y + z * z;

			// 1. Полный радиус гиперсферы
			const R = Math.sqrt(xyz + w * w);

			if (R < 1e-10) {
				console.error('cartesianToPolar: Invalid R = ' + R + '. Under constraction');
				return { altitude: 0, latitude: 0, longitude: 0 };
			}

			// 2. Вычисление Altitude (относительно оси W)
			// Диапазон [0, PI]
			const altitude = Math.acos(w / R);

			// Вычисляем радиус проекции в 3D пространстве (xyz)
			const rXYZ = Math.sqrt(xyz);

			// Если rXYZ близок к 0, значит точка лежит на оси W,
			// и широта с долготой не определены (принимаем за 0)
			if (rXYZ < 1e-10) {
				return { altitude: altitude, latitude: 0, longitude: 0 };
			}

			// 3. Вычисление Latitude (аналогично 3D сфере)
			// Диапазон [-PI/2, PI/2]
			const latitude = Math.asin(z / rXYZ);

			// 4. Вычисление Longitude
			// Диапазон (-PI, PI]
			const longitude = Math.atan2(y, x);

			return { altitude: altitude, latitude: latitude, longitude: longitude };
		};

		// --- ВСПОМОГАТЕЛЬНЫЕ  ФУНКЦИИ ВЫЧИСЛЕНИЯ СЛУЧАЙНОЙ ТОЧКИ ---

		/**
		 *<pre>
		 [Deepseek. Гипербола через три точки]{@link https://chat.deepseek.com/a/chat/s/1f8ddb5d-b9de-43d3-aa0d-3cfe49cd48a3}
		Есть декартова система координат. Ось x обозначим как arc. Найди элементарную функцию гиперболы которая пересекает три точки:
		(arc1 = 0, y1 = 0),
		(arc2 = π / 100, y2 = π - π / 100),
		(arc3 = π, y3 = π)
		 arc меняется только в диапазоне от 0 до π. arc это не угол.
		Написать код на javascript.

		Tеперь для построения функции для нахождения коэффициентов гиперболы оставим только две крайних точки, первую и третью, уберем среднюю точку,
		а вместо нее добавим некоторый параметр p, который будет меняться в диапазоне допустим от 0 до 1.
		Если p = 0, то гипербола вырождется в прямую.
		Если p = 1, то гипербола вырождется в два отрезка прямых:
		   Первый отрезок: (arc1 = 0, y1 = 0), (arc2 = 0, y2 = π) вертикальная прямая из начала координат.
		   Второй отрезок: (arc1 = 0, y1 = π), (arc2 = π, y2 = π) горизональная прямая.
		Написать код на javascript.
		Для визуализации примеров сделать [веб страницу]{@link https://raw.githack.com/anhr/commonNodeJS/master/HyperSphere/Examples/hyperbola.html}, в которой применить библиотеку three.js

		 Функция для вычисления коэффициентов гиперболы по параметру p
		 * </pre>
		 * @param {float} p <pre>Параметр, который меняется в диапазоне от 0 до 1 и который используется для вычисления параметров гиперболы.
		Если p = 0, то гипербола вырождется в прямую.
		Если p = 1, то гипербола вырождется в два отрезка прямых:
		   Первый отрезок: (arc1 = 0, y1 = 0), (arc2 = 0, y2 = π) вертикальная прямая из начала координат.
		   Второй отрезок: (arc1 = 0, y1 = π), (arc2 = π, y2 = π) горизональная прямая.
		 * </pre>
		 */
		//        let hyperbola_gpu;
		const calculateHyperbola = (p) => {

			// Крайние случаи
			if (p === 0) {
				// Прямая линия: y = x (через точки (0,0) и (π,π))
				/*
								hyperbola_gpu = `
											fn hyperbola_gpu(arc: f32, i: u32) -> f32 {

				*/
				return (arc) => { return arc; }
			}

			if (p === 1) {
				// Два отрезка: вертикальный и горизонтальный
				/*
								hyperbola_gpu = `
											fn hyperbola_gpu(arc: f32, i: u32) -> f32 {
												if (arc == 0) { return 0.0; }
												return PI;
											}`;
				*/
				return (arc) => {

					if (arc === 0) return 0
					return π;

				}
			}

			// Общий случай: гипербола вида y = a/(x - h) + k
			// У нас есть две точки: (0,0) и (π,π)
			// и дополнительное условие: при x = 0, y = 0
			// при x = π, y = π

			// Из точки (0,0): 0 = a/(0 - h) + k => k = a/h

			// Из точки (π,π): π = a/(π - h) + a/h

			// Вводим параметр p для контроля кривизны
			// Будем использовать p для определения положения асимптоты h
			// При p -> 0: h -> -∞ (гипербола вырождается в прямую)
			// При p -> 1: h -> 0 (гипербола вырождается в вертикальную линию)

			// Свяжем h с p: h = - (1-p)/p * C, где C некоторая константа
			// Чтобы при p=1, h=0; при p=0, h=-∞
			// Возьмем C = π/2 для хорошей визуализации

			const C = π / 2;

			// Избегаем деления на ноль при p=0 (уже обработано выше)
			let h;

			// Упростим: a = h * (PI - h)

			/*

												messageBuffer.i = i;
												messageBuffer.value = x;
												return PI;
											}
											return ${a} / (x - (${h})) + (${k});
										}`;

			return (x) => {

				// Гипербола

				// В нашем случае h всегда отрицательное, так что асимптота слева от 0
				// Проверяем, что не попадаем в асимптоту
				if (Math.abs(x - h) < 0.001) {

					console.error(sRandomVertice + ': calculateHyperbola. Under consraction');
					return x;

				}
				return a / (x - h) + k;

			}

		}
		const hyperbola = calculateHyperbola(config.p);

		// 4. Преобразование декартовых координат в углы
		const cartesianToPolarRandom = (Q) => { return cartesianToPolar({ x: Q[2], y: Q[3], z: Q[1], w: Q[0] }); }

		// 2. Создание ортонормированного базиса в касательном пространстве
		const createTangentBasis = (latitude, longitude, altitude) => {
			const a = altitude, b = Math.PI / 2 - latitude, c = longitude,
				sina = sin(a), cosa = cos(a),
				sinb = sin(b), cosb = cos(b),
				sinc = sin(c), cosc = cos(c);

			// e1 - направление увеличения altitude
			const e1 = [
				-sina,
				cosa * cosb,
				cosa * sinb * cosc,
				cosa * sinb * sinc
			];
			// Нормализация e1 (уже единичный, но для точности)
			//e1.reduce вычисляет сумму квадратов улементов e1
			const norm_e1 = Math.sqrt(e1.reduce((sum, val) => sum + val * val, 0));
			//e1.map создает новый массив путем деления каждого элемента на norm_e1
			const e1_norm = e1.map(v => v / norm_e1);

			// e2 - направление увеличения b (уменьшения latitude)
			const e2_raw = [
				0,
				-sina * sinb,
				sina * cosb * cosc,
				sina * cosb * sinc
			];
			const norm_e2 = Math.sqrt(e2_raw.reduce((sum, val) => sum + val * val, 0));
			const e2_norm = norm_e2 > 1e-10 ? e2_raw.map(v => v / norm_e2) : [0, 0, 0, 0];

			// e3 - направление увеличения longitude
			const e3_raw = [
				0,
				0,
				-sina * sinb * sinc,
				sina * sinb * cosc
			];
			const norm_e3 = Math.sqrt(e3_raw.reduce((sum, val) => sum + val * val, 0));
			const e3_norm = norm_e3 > 1e-10 ? e3_raw.map(v => v / norm_e3) : [0, 0, 0, 0];

			return [e1_norm, e2_norm, e3_norm];

		 * @param {object} startingPointParams see startingPointParams above.
		 * @param {any} distance геодезическое расстояние. Диапазон значений: 0 ≤ distance ≤ πR
		 * @param {any} eta первый угол направления (полярный угол). Определяет наклон направления движения относительно "вертикали" в касательном пространстве.
		 * Аналог "широты" направления или "угла места".
		 * Диапазон значений: 0 ≤ eta ≤ π
		 * @param {any} psi второй угол направления (азимутальный угол)
		 * Назначение:
		 * Определяет азимут направления движения в горизонтальной плоскости касательного пространства
		 * Задает вращение вокруг оси e1
		 * Диапазон значений:
		 * Необходимый и достаточный: 0 ≤ psi < 2π
		 * Но обычно достаточно: -π ≤ psi ≤ π (как в коде)
		 * @returns координаты новой точки в полярной системе координат
		 */
		const calculateNewPoint = (startingPointParams, distance, eta, psi, R) => {
			// Исходная точка
			const P = startingPointParams.P;

			// Касательный базис
			const [e1, e2, e3] = [startingPointParams.e1, startingPointParams.e2, startingPointParams.e3];

			const coseta = cos(eta), sineta = sin(eta), cospsi = cos(psi), sinpsi = sin(psi), sinetacospsi = sineta * cospsi, sinetasinpsi = sineta * sinpsi;

			// Направляющий вектор в касательном пространстве
			const u = [0, 0, 0, 0];
			for (let i = 0; i < 4; i++) {
				u[i] = coseta * e1[i] +
					sinetacospsi * e2[i] +
					sinetasinpsi * e3[i];
			}

			// Угловое расстояние
			const delta = distance / R;

			// Экспоненциальное отображение
			const Q = [0, 0, 0, 0];
			for (let i = 0; i < 4; i++) {
				Q[i] = Math.cos(delta) * P[i] + R * Math.sin(delta) * u[i];
			}

			// Обратное преобразование в углы
			const angles = cartesianToPolarRandom(Q);

			if (Math.abs((Math.abs(startingPointParams.lat) - π / 2)) < 1e-12) angles.longitude = random() * 2 * π - π;//Противоположная вершина находится на полюсе
			return angles;
		}
		const getStartingPointParams = (oppositeVertice) => {
			const lat = oppositeVertice.latitude, lon = oppositeVertice.longitude, alt = oppositeVertice.altitude;

			// Исходная точка
			const objectP = polarToCartesian(lat, lon, alt), P = [objectP.w, objectP.z, objectP.x, objectP.y];

			// Касательный базис
			const [e1, e2, e3] = createTangentBasis(lat, lon, alt);

			return {

				lat: lat,
				alt: alt,
				P: P,
				e1: e1,
				e2: e2,
				e3: e3,

			}

		}

		/**
		 * Функция распределения (CDF) для расстояния на S³
		 */
		const CDF_S3 = (theta) => {
			// CDF(θ) = (3θ - 3sinθcosθ + 2sin³θ) / 4
			const sinTheta = Math.sin(theta);
			const cosTheta = Math.cos(theta);
			const sin3Theta = sinTheta * sinTheta * sinTheta;

			return (3 * theta - 3 * sinTheta * cosTheta + 2 * sin3Theta) / 4;
		}
		const getDistance = (distance, R, arc) => {

			if (arc === 0) return 0;

			/*Есть декартова система координат. Ось x обозначим как arc. Найди элементарную функцию которая неогранниченно растет в точке arc = 0 и равна нулю в точке arc = π.
			arc меняется только в диапазоне от 0 до π. arc это не угол.
			Написать код на javascript
			*/
			//https://chat.deepseek.com/a/chat/s/0b71542a-46a2-47e2-9888-f95f26f0fa37
			const y = 1 / arc - 1 / π;

			return distance / (1 + (y * R * random()));

		}
		const getRandomAngles = (startingPointParams, arc) => {


			// Правильное распределение для равномерного покрытия:
			// Вероятность попасть в сферическую шапочку радиуса d пропорциональна sin^3(d/R)
			const R = 1, distance = getDistance(R * inverseCDF_S3(random()), R, arc) * 2;

			return calculateNewPoint(
				startingPointParams,
				distance,//максимальная дистанция находится на противоположной стороне гиперсферы
				Math.acos(2 * random() - 1),//eta. первый угол направления (полярный угол). 0 ≤ eta ≤ π
				random() * 2 * π,//psi. второй угол направления (азимутальный угол). 0 ≤ psi < 2π или -π ≤ psi ≤ π
				R
			);

		}
		const GetRandomVertice = (arc, oppositeVertice) => { return getRandomAngles(getStartingPointParams(oppositeVertice), arc); }
		/**
		 * Обратная функция распределения для равномерной выборки на S³
		 * Для равномерного распределения на 3-сфере от северного полюса:
		 * Плотность: f(θ) ∝ sin³(θ), где θ = distance/R
		 * CDF: F(θ) = (3θ - 3sinθcosθ + 2sin³θ) / 4
		 * Здесь используем численное решение обратной функции
		 */
		const inverseCDF_S3 = (u) => {
			// u ∈ [0, 1] равномерно
			// Ищем θ такой, что CDF(θ) = u, θ ∈ [0, π]

			// Численное решение методом бисекции
			let low = 0;
			let high = Math.PI;
			const tolerance = 1e-10;
			const maxIterations = 100;

			for (let i = 0; i < maxIterations; i++) {
				const mid = (low + high) / 2;
				const cdfValue = CDF_S3(mid);

				if (Math.abs(cdfValue - u) < tolerance) {
					return mid;
				}

				if (cdfValue < u) {
					low = mid;
				} else {
					high = mid;
				}
			}

			return (low + high) / 2;
		}
		// --- ЛОГИКА CPU (СИНХРОНИЗИРОВАНА С GPU j=0) ---
		const setVelocities = (velociti, DAMPING, force) => {

			velociti.x = velociti.x * DAMPING + force.x;
			velociti.y = velociti.y * DAMPING + force.y;
			velociti.z = velociti.z * DAMPING + force.z;
			velociti.w = velociti.w * DAMPING + force.w;

		}
		const setForse = (force, d, dist, m) => { force.x += (d.x / dist) * m; force.y += (d.y / dist) * m; force.z += (d.z / dist) * m; force.w += (d.w / dist) * m; }
		const getD = (p1, p2) => { return { x: p1.x - p2.x, y: p1.y - p2.y, z: p1.z - p2.z, w: p1.w - p2.w } }
		const getD2 = (d) => { return d.x * d.x + d.y * d.y + d.z * d.z + d.w * d.w }

		function initPoints() {
			const color = new THREE.Color();
			if (!config.RANDOM_POINTS) {
				//angles[0] = { altitude: Math.PI / 1, latitude: Math.PI / 19, longitude: Math.PI / 10 };// Эта вершина лежит на оси W потомучто Altitude = Math.PI. Это приводит к тому что в функции cartesianToPolar величина rXYZ < 1e-10 и широта с долготой не определены (принимаем за 0)
				angles[0] = { altitude: Math.PI / 1.5, latitude: Math.PI / 19, longitude: Math.PI / 10 };
				angles[1] = { altitude: Math.PI / 2, latitude: Math.PI / 20, longitude: Math.PI / 11 };
				angles[2] = { altitude: Math.PI / 3, latitude: Math.PI / 21, longitude: Math.PI / 2 };
				angles[3] = { altitude: Math.PI / 4, latitude: Math.PI / 22, longitude: -Math.PI / 2 };
				angles[4] = { altitude: Math.PI / 5, latitude: Math.PI / 23, longitude: Math.PI };
				/*
				//антиподальные точки. Расположены на противоположных концах гиперсферы
				// Точка 1: Произвольное положение на гиперсфере
				angles[0] = { altitude: 1.0, latitude: 0.5, longitude: 2.0 };
				// Точка 2: Максимально удаленная (антипод для Точки 1)
//				angles[1] = { altitude: Math.PI - 1.0, latitude: Math.PI - 0.5, longitude: (2.0 + Math.PI) % (2 * Math.PI) };
				angles[1] = { altitude: Math.PI - 1.0, latitude: 0.5, longitude: (2.0 + Math.PI) % (2 * Math.PI) };
				*/
			}
			for (let i = 0; i < config.pointsPerStep; i++) {
				if (config.RANDOM_POINTS || i >= config.pointsPerStep) {
					const u = Array.from({ length: 4 }, () => Math.random() * 2 - 1);
					const norm = Math.sqrt(u.reduce((a, b) => a + b * b, 0)) || 1;
					angles[i] = cartesianToPolar({ x: u[0] / norm, y: u[1] / norm, z: u[2] / norm, w: u[3] / norm });
				}
				const p = polarToCartesian(angles[i].latitude, angles[i].longitude, angles[i].altitude, config.baseRadius);
				posAttr.setXYZ(i, p.x, p.y, p.z);
				const t = (p.w + config.radiusMax) / (2 * config.radiusMax);
				color.setHSL(0.7 * (1 - t), 1, 0.5); colorAttr.setXYZ(i, color.r, color.g, color.b);
			}
			posAttr.needsUpdate = true; colorAttr.needsUpdate = true;
		}

		function updateDisplay() {
			document.getElementById('stepCounter').innerText = currentStep;
			document.getElementById('radVal').innerText = radiusPrev.toFixed(2);
			document.getElementById('timeResult').innerText = `Итог: ${((performance.now() - start) / 1000).toFixed(3)} сек.`;
		}

		let socket, start;
		const runAuto = async () => {
			document.querySelectorAll('button').forEach(b => b.disabled = true);
			start = performance.now();
			if (socket && socket.readyState === WebSocket.OPEN) {
				socket.close(1000,//статус нормальное закрытие
					"Reconnecting for new computation...");
			}
			const serverAddress = 'ws://localhost:5000/ws?type=main';
			socket = new WebSocket(serverAddress);
			socket.binaryType = 'arraybuffer';

			const stateText = document.getElementById('stateText');

			// 1. Обработка ошибок (неверный адрес, отказ в соединении)
			socket.onerror = (error) => {
				stateText.innerText = error.target.url + " ОШИБКА: Сервер недоступен или адрес указан неверно.";
				stateText.style.color = "#ff4444";
				console.error("WebSocket Error:", error);
			};

			// 2. Обработка закрытия соединения (сервер отключился в процессе)
			socket.onclose = (event) => {
				if (event.wasClean) {
					stateText.innerText = event.reason ? event.reason : "The connection was closed successfully.";
					if (event.code === 4001) stateText.style.color = "#ff4444";  // Эта страница уже открыта
				} else {
					function rgbToHex(rgbString) {
						// Находим все числа в строке с помощью регулярного выражения
						const rgb = rgbString.match(/\d+/g).map(Number);

						// Переводим каждое число в HEX и дополняем нулями слева, если нужно
						return "#" + rgb.map(x => x.toString(16).padStart(2, '0')).join('');
					}
					if (rgbToHex(stateText.style.color) != "#ff4444") {//Не маскировать сообщение об ошибке
						let error = '';
						if (event.code != 1006) {
							const rfcLink = "https://datatracker.ietf.org/doc/html/rfc6455#section-7.4.1";
							const mozillaLink = 'https://developer.mozilla.org/en-US/docs/Web/API/CloseEvent/code'
							const errorDetail = event.reason ? `Reason: ${event.reason}` : `Error Code: ${event.code}`;
							error = ` ${errorDetail}. See RFC: ${rfcLink}, mozilla: ${mozillaLink}`;
						}
						const sMessage = `The connection was closed.` + error
						//                        console.error(sMessage);

						//                        console.log(`Причина: ${event.reason}`); // Текстовое описание от сервера
						stateText.innerText = sMessage;//"СВЯЗЬ ПРЕРВАНА (Сервер упал или ошибка сети).";
						stateText.style.color = "#00ffcc";
					}
				}
				console.log(`Код закрытия: ${event.code}, причина: ${event.reason}`);
			};
			/*если оставить этот код, то истина причина ошибки будет забиваться сообщением  "Превышено время ожидания сервера."
			const connectionTimeout = setTimeout(() => {
				if (socket.readyState !== WebSocket.OPEN) {
					stateText.innerText = "Превышено время ожидания сервера.";
					socket.close(); // Принудительно закрываем попытку
				}
			}, 5000); // Ждем 5 секунд и сдаемся
			*/
			// 3. Успешное подключение
			socket.onopen = () => {
				//clearTimeout(connectionTimeout); // Успели! Отменяем таймер.
				stateText.innerText = "Связь установлена. Готов к работе.";
				stateText.style.color = "#00ffcc";
				/*
									const config = {
										type: 'START_COMPUTE',
										DEBUG_MODE: DEBUG_MODE,
										RANDOM_POINTS: RANDOM_POINTS,
										DAMPING: DAMPING,
										REPULSION_STRENGTH: REPULSION_STRENGTH,
										PSEUDO_RANDOM: PSEUDO_RANDOM,
										p: p,
										baseRadius: baseRadius,
										radiusMax: radiusMax,
										totalSteps: totalSteps,
										pointsPerStep: pointsPerStep
									};
				*/
				socket.send(JSON.stringify(config));

				const anglesItemSize = 4, initialAngles = new Float32Array(config.pointsPerStep * anglesItemSize);
				for (let i = 0; i < config.pointsPerStep; i++) {
					let index = i * anglesItemSize;
					initialAngles[index++] = angles[i].latitude; initialAngles[index++] = angles[i].longitude; initialAngles[index++] = angles[i].altitude;
				}
				socket.send(initialAngles.buffer);
			};
			socket.onmessage = (event) => {
				if (typeof event.data === 'string') {
					const data = JSON.parse(event.data);

					switch (data.type) {
						case "STATUS":
							const stateText = document.getElementById('stateText');
							stateText.innerText = data.message;

							// Используем 0 и 1 для управления цветом
							stateText.style.color = (data.code === 1) ? "#00ffcc" : "#ff4444";
							break;
						case "PROGRESS":
							currentStep = data.currentStep;
							radiusPrev = data.radiusPrev;
							updateDisplay();
							if (socket && socket.readyState === WebSocket.OPEN)
								socket.send(JSON.stringify({ type: "PROGRESS", currentStep: currentStep + 1 }));
							break;
						default: console.error('socket message: Invalid data.type: ' + data.type);
					}
				} else if (typeof event.data === 'object') {
					//Vertices positions
					const posData = new Float32Array(event.data);
					for (let i = 0; i < count; i++) {
						let index = i * 4;
						const pointCur = { x: posData[index++], y: posData[index++], z: posData[index++], w: posData[index++], };
						const itemAngles = cartesianToPolar(pointCur);
						const pointAngles = angles[i];
						pointAngles.latitude = itemAngles.latitude; pointAngles.longitude = itemAngles.longitude; pointAngles.altitude = itemAngles.altitude;
						//console.log('i = ' + i + ' angles: ' + JSON.stringify(pointAngles))
						const s = Math.floor(i / config.pointsPerStep);
						const r = config.baseRadius + s * radiusStep;
						if (LOG) console.log('Step:' + (parseInt(i / config.pointsPerStep)) + ' Point:' + i + '. x=' + pointCur.x + ' y=' + pointCur.y + ' z=' + pointCur.z + ' w=' + pointCur.w + ',alt=' + pointAngles.altitude + ' lat=' + pointAngles.latitude + ' lon=' + pointAngles.longitude);
						setAttributes(pointAngles, r, i);
					}
					posAttr.needsUpdate = true; colorAttr.needsUpdate = true;
					document.getElementById('timeResult').innerText = `Итог : ${((performance.now() - start) / 1000).toFixed(3)} сек.`;
					socket.close();
				} else console.error('socket message: Invalid event.data type: ' + (typeof event.data));
			};
			const end = performance.now();
			document.getElementById('timeResult').innerText = `Итог (${((end - start) / 1000).toFixed(3)} сек.`;
			document.querySelectorAll('button').forEach(b => b.disabled = false);
		};

//		document.getElementById('stepBtn').onclick = () => performStepCPU();
//		document.getElementById('startBtn').onclick = () => runAuto('CPU');
		document.getElementById('gpuBtn').onclick = () => runAuto();
		const totalSteps = config.totalSteps, pointsPerStep = config.pointsPerStep;
		document.getElementById('analysisBtn').onclick = () => analysis({
			totalSteps,
			pointsPerStep,
			angles,

			//totalEnergy: Общая энергия системы (E). Если totalEnergy растет от шага к шагу: Ошибка в знаках сил (точки притягиваются вместо отталкивания) либо слишком большой шаг интегрирования (dt). Энергия totalEnergy уходит в бесконечность или NaN: Ошибка в коде вычислений, при которой две точки заняли абсолютно одинаковые координаты (деление на ноль). Проверьте генератор случайных чисел или начальную инициализацию.
			//meanD: Среднее расстояние до ближайшего соседа. Должно постепенно расти, пока не стабилизируется.
			//variance: Дисперсия(средний квадрат отклонения).Мера того, насколько сильно расстояния до соседей у разных точек "разбросаны" относительно вычисленного среднего значения meanD.
			//stdDev: Среднеквадратичное отклонение (СКО): С каждым шагом алгоритма значение stdDev должно стремиться к нулю.
			//deviationPercent: Коэффициент вариации (дисбаланс). Коэффициент вариации (deviationPercent) высокий (например, > 15-20%): Точки распределены хаотично, решетка не сформировалась. Скорее всего, силам отталкивания не хватает итераций, либо коэффициент затухания скорости (DAMPING) гасит движение слишком рано. deviationPercent стремится к 0% (например, < 2-5%): Алгоритм работает отлично, структура симметрична, точки распределились максимально равномерно.
			displayProperty: 'totalEnergy',

		});
		function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
		//        findAdapters();
		initPoints();
		animate();
	</script>
