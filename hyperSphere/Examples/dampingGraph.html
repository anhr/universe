	<script type="module">

		import HypersphericalUniverse from '../hyperSphericalUniverse.js';
		//import HypersphericalUniverse from '../build/hyperSphericalUniverse.module.js';
		//import HypersphericalUniverse from '../build/hyperSphericalUniverse.module.min.js';

		//import HypersphericalUniverse from 'https://raw.githack.com/anhr/universe/main/hyperSphere/build/hyperSphericalUniverse.module.js';

		import * as HUniverseParams from './HUniverseParams.js'
		import ND from '../../../../commonNodeJS/master/nD/nD.js';
		import Position from '../../../../commonNodeJS/master/HyperSphere/position.js'

		const iterationConfig = {
			steps: 5,//Количество итераций, в ходе которых будет вычисляться гипервселенная с разными настройками
			DAMPING: { min: 0, max: 1 },

			//Этои идинтификатор указывает положение выбранного времени в органе управления cTimes и на 1 больше, чем текущее timeId проигрывателя
			selectedTimeId: 1,//min = 1, max = HUniverseParams.myThreeOptions.playerOptions.marks.
			//ВНИМАНИЕ! Если в этом месте HUniverseParams.myThreeOptions.playerOptions.marks еще не определено, то его зачение по умолчпнию можно узнать после выполнения строки const hypersphericalUniverse = new HypersphericalUniverse
			
			//Этои идинтификатор указывает положение выбранной вершины в органе управления cPoints и на 1 больше, чем текущие углы вершины в HUniverseParams.classSettings.settings.object.geometry.angles
			selectedPointId: 110,//min = 1, max = HUniverseParams.classSettings.settings.object.geometry.angles.length
		}
		const steps = iterationConfig.steps;
		let iterationId = 0;//Индекс текущей итерации
		const damping = () => {
			const minDamping = iterationConfig.DAMPING.min;
			const maxDamping = iterationConfig.DAMPING.max;
			// Расчет коэффициентов a и b
			const a = (maxDamping - minDamping) / (steps - 1);
			const b = minDamping;
			HUniverseParams.classSettings.compute.config.DAMPING = a * iterationId + b;
		}
		damping();
		
		const scalesZ = HUniverseParams.myThreeOptions.scales.z;
		scalesZ.min *= steps; scalesZ.max *= steps; scalesZ.name = 'DAMPING';
		HUniverseParams.myThreeOptions.scene.scale.z /= steps;
		
		const hypersphericalUniverse = new HypersphericalUniverse(HUniverseParams.classSettings, HUniverseParams.myThreeOptions);
		class IterationProgressBar {
			constructor() {
				const elParent = HUniverseParams.classSettings.settings.options.renderer.domElement.parentElement;
				let elcontainer;
				const containerName = 'ProgressContainer';
				for (let i = 0; i < elParent.children.length; i++) {
	
					const child = elParent.children[i];
					if (child.name && (child.name === containerName)) {
	
						elcontainer = child;
						break;
	
					}
	
				}
				if (!elcontainer) {
	
					elcontainer = document.createElement('table');
					elcontainer.name = containerName;
					elcontainer.style.position = 'absolute';
					elcontainer.style.top = 0;
					elcontainer.style.left = 0;
					elParent.appendChild(elcontainer);
	
				}
				const elProgress = document.createElement('div');
			
				const elTitle = document.createElement('div');
				elTitle.innerHTML = 'Iteration<div id="socket-status">'
					+ '<strong>Step:</strong> <span id="stepCounter">' + iterationId + '</span> / <span>' + (steps - 1) + '</span><br>'
					+ '<strong>Elapsed Time:</strong> <span id="timeResult">---</span> sec.<br>'
//					+ '<button type="button" id="btnCloseIteration" title="Close this window" style="display: block;">Close</button>'
				+ '</div>';
/*оба диалоговых окна закрываются кнопкой Close в окне GPU				
				const btnClose = elTitle.querySelector("#btnCloseIteration");
				btnClose.onclick = () => { elcontainer.remove(); }
*/				
				
				elTitle.style.color = 'black';
				elProgress.appendChild(elTitle);

				//info
				const stepCounter = elTitle.querySelector("#stepCounter");
				const timeResult = elTitle.querySelector("#timeResult");
	            const start = performance.now();
			
				const cProgress = document.createElement('input');
				cProgress.min = 0;
				cProgress.max = steps - 1;
				cProgress.value = 0;
				cProgress.type = "range";
				cProgress.disabled = true;
				elProgress.appendChild(cProgress);
				elProgress.style.backgroundColor = 'white';
				elProgress.style.margin = '2px';
				elProgress.style.padding = '2px';
				const elRow = document.createElement('tr');
				elRow.appendChild(elProgress);
				elcontainer.appendChild(elRow);
				this.updateDisplay = () => {
		            stepCounter.innerText = iterationId;
		            timeResult.innerText = `${((performance.now() - start) / 1000).toFixed(3)}`;
					cProgress.value = iterationId;
		        }				
			}
		}
		{
			const angles = HUniverseParams.classSettings.settings.object.geometry.angles,
				anglesLength = angles.length === undefined ? angles.count : angles.length;
			if ((iterationConfig.selectedPointId < 1) || (iterationConfig.selectedPointId > anglesLength)) console.error('Invalid iterationConfig.selectedPointId = ' + iterationConfig.selectedPointId);
			if ((iterationConfig.selectedTimeId < 1) || (iterationConfig.selectedTimeId > HUniverseParams.myThreeOptions.playerOptions.marks)) console.error('Invalid iterationConfig.selectedTimeId = ' + iterationConfig.selectedTimeId);
		}
		class Trace extends ND {

			constructor(traces) {

				const settings = { object: { geometry: { angles: [] } } };//classSettings.settings;
				const tracesPosition = traces.geometry.attributes.position,
					tracesIndex = traces.geometry.index,
					tracesIndexArray = tracesIndex.array,
					THREE = window.__myThree__.three.THREE;
				const isEven = (num) => num % 2 === 0;
				if (!isEven(tracesIndex.count)) console.error('class Trace: tracesIndex.count is not even');
				/*
															settings.bufferGeometry ||= new THREE.BufferGeometry();
															settings.bufferGeometry.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(
																(
																	(tracesIndex.count / 2)
																	+ 1//Добавить одну вершину, индекс которой находтся в конце tracesIndex
																)
																* tracesPosition.itemSize), tracesPosition.itemSize));
															const position = settings.bufferGeometry.attributes.position;
															for (let i = 0; i <= tracesIndex.count; i+=2){
																const vector = new THREE.Vector4().fromBufferAttribute(tracesPosition, 
																													   tracesIndexArray[i] === undefined ?
																														   tracesIndexArray[i - 1] ://добавить последнюю вершину
																														   tracesIndexArray[i]);
																
																//выбрать один из 3 смпособов записи из мусещкы в массив:
																//position.setXYZW(i / 2, vector.x, vector.y, vector.z, vector.w);
																position.set(vector.toArray(), i * 2);
																
																console.log(vector)
															}
				*/
				const length = (tracesIndex.count / 2)
					+ 1,//Добавить одну вершину, индекс которой находтся в конце tracesIndex
					getVector = (i) => {
						return Position(new THREE.Vector4().fromBufferAttribute(tracesPosition,
							tracesIndexArray[i] === undefined ?
								tracesIndexArray[i - 1] ://добавить последнюю вершину
								tracesIndexArray[i]).toArray());
					}
				const indices = [];
				for (let i = 0; i < length - 1; i++) indices.push([i, i + 1]);
				const position = new Proxy([], {
					get(target, name) {
						const positionId = parseInt(name);
						if (!isNaN(positionId)) return getVector(positionId * 2);
						switch (name) {
							case 'isPositionProxy': return true;
							case 'isProxy': return true;
							case 'target': return false;
							case 'boPositionError': return target.boPositionError;
							case 'length': return length;
							/*														
																				case 'forEach': return (item) => {
																					//сюда попадает ,когда добавляются ребра
																					for (let i = 0; i <= length; i++) {
																						item(getVector(i), i);
							//															item(getVector(i + 1), i + 1);
																					}
																				}
							*/
						}
						console.error('class Trace: Invalid position name: ' + name);
						return;
					}
				});
				const colors = new Proxy([], {
					get(target, name) {

						//Нужно сформировать массив colors. Цвет каждой вершины состоит из 3 элементов массива colors. Эти 3 элемента равны RGB цвета вершины.
						//colorId указывает на одну из составляющих RGB цвета вершины
						//
						//номер вершины verticeId
						//номер компоненты цвета rgbId = 0 красный или rgbId = 1 зеленый или rgbId = 2 синий
						//colorId = verticeId * 3 + rgbId.
						//Если verticeId = 2 и rgbId = 1, то colorId = 2 * 3 + 1 = 7
						const colorId = parseInt(name);

						if (!isNaN(colorId)) {

							//разбиваем colorId на две компонеты: 
							const verticeId = parseInt(colorId / 3);
							const rgbId = colorId - verticeId * 3;

							const color = traces.geometry.attributes.color;
							const rgb = new THREE.Vector3().fromBufferAttribute(color,
								tracesIndexArray[verticeId * 2]).toArray();
							return rgb[rgbId];
							/*													
																				return new THREE.Vector3().fromBufferAttribute(traces.geometry.attributes.color, 
																				   tracesIndexArray[colorId * 2]).toArray();
							*/
						}
						/*														
																		switch (name) {
																			case 'isPositionProxy': return true;
																			case 'isProxy': return true;
																			case 'target': return false;
																			case 'boPositionError': return target.boPositionError;
																			case 'length': return length;
																		}
						*/
						console.error('class Trace: Invalid color name: ' + name);
						return;
					}
				});
				const classSettings = hypersphericalUniverse.hyperSphere.classSettings;
				super(4, {

					options: classSettings.settings.options,
					//bufferAttributes: settings.bufferGeometry.attributes,
					scene: classSettings.projectParams.scene,
					isRaycaster: true,
					object: {
						//													position: new window.__myThree__.three.THREE.Vector3(0, 0, 5),//{ x: 0, y: 0, z: 5 },
						name: 'DAMPING=' + classSettings.compute.config.DAMPING,
						geometry: {
							position: position,
							//indices: [[ [0,1], [1,2], [2,3], [3,0], ]],//Debug. Edges
							indices: [indices],
							opacity: 1,//задать этот параметр, чтобы можно было делать треки прозрачными
							/*
							colors: [
								1, 0, 0,//red
								0, 1, 0,//green
								0, 0, 1,//blue
								//1, 1, 1,//white
							],
							*/
							colors: colors,
						}
					},
					overriddenProperties: {
						setTracesIndices: (bufferGeometry) => {
							/*														
																					bufferGeometry.userData = { setDrawRange: (timeId = classSettings.settings.options.player.getTimeId()) => { bufferGeometry.setDrawRange(0, timeIndexCount * timeId); } }
																					bufferGeometry.userData.setDrawRange();
							*/
						}
					},
				});
			}
		}
		const settings = HUniverseParams.classSettings.settings;
		settings.onUniverseReady = () => {
			setTimeout(() => {
				let boTraceDetected = false;
				for (let i = 0; i < cMeshs.__select.length; i++) {
					const option = cMeshs.__select[i];
					if (option.mesh && option.mesh.name === 'Traces') {
						boTraceDetected = true;
						const trace = new Trace(option.mesh);
						const step = (scalesZ.max - scalesZ.min) / steps;
						trace.object3D.position.z = scalesZ.min + step * iterationId + step / 2;
	
						iterationId++;
						if (iterationId >= steps) return;
						iterationProgressBar.updateDisplay();
						damping();
						HUniverseParams.classSettings.distanceOfVertices.webGPU.resetSocket();
						settings.guiPoints.appendTimesChild = undefined;
						settings.guiPoints.timeId = undefined;
						play();
					}
				}
				if (!boTraceDetected) console.error('trace is not detected');
			}, 0);
		}
/*
		settings.onUniverseReady = () => {
			iterationId++;
			if(iterationId >= steps) return;
			iterationProgressBar.updateDisplay();
			damping();
			HUniverseParams.classSettings.distanceOfVertices.webGPU.resetSocket();
			settings.guiPoints.appendTimesChild = undefined;
			settings.guiPoints.timeId = undefined;
			play();
		}
*/
		const gui = hypersphericalUniverse.hyperSphere.classSettings.settings.options.dat.gui, cMeshs = gui.cMeshs;
		const iterationProgressBar = new IterationProgressBar();
		hypersphericalUniverse.hyperSphere.classSettings.settings.options.onDataReady = () => {
//console.log('Under constraction')
//return;
			for (let i = 0; i < cMeshs.__select.length; i++ ) {
				const option = cMeshs.__select[i];
				if(option.mesh && option.mesh.userData.type === 'Universe') {
//					hypersphericalUniverse.hyperSphere.classSettings.settings.options.guiSelectPoint.select( {} );//Выбрать вершину
					setTimeout(() => {
						cMeshs.__select[i].selected = true;
						cMeshs.__onChange(i);

						setTimeout(() => {
							const cTimes = gui.cTimes;
							const selectedTimeId = iterationConfig.selectedTimeId;
							cTimes.__select[selectedTimeId].selected = true;
							cTimes.__onChange(selectedTimeId);
							
							setTimeout(() => {
								const cPoints = gui.cPoints;
								const selectedPointId = iterationConfig.selectedPointId;
								if (selectedPointId < 1) console.error('onDataReady: Invalid selectedPointId = ' + selectedPointId);
								else {
									cPoints.__select[selectedPointId].selected = true;
//									const timeId = selectedPointId - 1;
									option.mesh.userData.myObject.guiPoints.timeId = selectedTimeId - 1;
									cPoints.__onChange(selectedPointId - 1);
									gui.cTrace.setValue(true);
/*											
									for (let i = 0; i < cMeshs.__select.length; i++ ) {
										const option = cMeshs.__select[i];
										if(option.mesh && option.mesh.name === 'Traces') {
											const trace = new Trace(option.mesh);
											const step = (scalesZ.max - scalesZ.min) / steps;
											trace.object3D.position.z = scalesZ.min + step * (iterationId - 1) + step / 2;
											const settings = HUniverseParams.classSettings.settings;
											settings.onUniverseReady = () => {
												iterationId++;
												if(iterationId >= steps) return;
												iterationProgressBar.updateDisplay();
												damping();
												HUniverseParams.classSettings.distanceOfVertices.webGPU.resetSocket();
												settings.guiPoints.appendTimesChild = undefined;
												settings.guiPoints.timeId = undefined;
												play();
											}
										}
									}
*/											
								}
							}, 0);
						}, 0);
					}, 0);
					break;
				}
//				if ( option.selected && Object.is( option.mesh, intersectionSelected.object ) ) setPosition( intersectionSelected );
			}
			//hypersphericalUniverse.hyperSphere.classSettings.settings.options.trace.onChange();//Построить трек
		}

		const play = () => { setTimeout(() => {
			hypersphericalUniverse.hyperSphere.classSettings.settings.object.geometry.times.length = 1;
			hypersphericalUniverse.hyperSphere.classSettings.settings.options.player.play3DObject(0); }, 0);
		}
		play();

	</script>
