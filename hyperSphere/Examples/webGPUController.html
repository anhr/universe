//            if (LOG) console.log('Step:' + (parseInt(index / pointsPerStep)) + ' Point:' + index + '. x=' + p.x + ' y=' + p.y + ' z=' + p.z + ' w=' + p.w + ',alt=' + pointAngles.altitude + ' lat=' + pointAngles.latitude + ' lon=' + pointAngles.longitude);

		// --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ МАТЕМАТИКИ ---
		const polarToCartesian = (la, lo, al, r = 1) => {
			const r_xyz = r * Math.sin(al);
			return { x: r_xyz * Math.cos(la) * Math.cos(lo), y: r_xyz * Math.cos(la) * Math.sin(lo), z: r_xyz * Math.sin(la), w: r * Math.cos(al) };
		};
		const cartesianToPolar = (vertice) => {
			const x = vertice.x;
			const y = vertice.y;
			const z = vertice.z;
			const w = vertice.w;
			const xyz = x * x + y * y + z * z;

			// 1. Полный радиус гиперсферы
			const R = Math.sqrt(xyz + w * w);

			if (R < 1e-10) {
				console.error('cartesianToPolar: Invalid R = ' + R + '. Under constraction');
				return { altitude: 0, latitude: 0, longitude: 0 };
			}

			// 2. Вычисление Altitude (относительно оси W)
			// Диапазон [0, PI]
			const altitude = Math.acos(w / R);

			// Вычисляем радиус проекции в 3D пространстве (xyz)
			const rXYZ = Math.sqrt(xyz);

			// Если rXYZ близок к 0, значит точка лежит на оси W,
			// и широта с долготой не определены (принимаем за 0)
			if (rXYZ < 1e-10) {
				return { altitude: altitude, latitude: 0, longitude: 0 };
			}

			// 3. Вычисление Latitude (аналогично 3D сфере)
			// Диапазон [-PI/2, PI/2]
			const latitude = Math.asin(z / rXYZ);

			// 4. Вычисление Longitude
			// Диапазон (-PI, PI]
			const longitude = Math.atan2(y, x);

			return { altitude: altitude, latitude: latitude, longitude: longitude };
		};

		// --- ВСПОМОГАТЕЛЬНЫЕ  ФУНКЦИИ ВЫЧИСЛЕНИЯ СЛУЧАЙНОЙ ТОЧКИ ---

		/**
		 *<pre>

		Есть декартова система координат. Ось x обозначим как arc. Найди элементарную функцию гиперболы которая пересекает три точки:
		(arc1 = 0, y1 = 0),
		(arc2 = π / 100, y2 = π - π / 100),
		(arc3 = π, y3 = π)
		 arc меняется только в диапазоне от 0 до π. arc это не угол.
		Написать код на javascript.

		Tеперь для построения функции для нахождения коэффициентов гиперболы оставим только две крайних точки, первую и третью, уберем среднюю точку,
		а вместо нее добавим некоторый параметр p, который будет меняться в диапазоне допустим от 0 до 1.
		Если p = 0, то гипербола вырождется в прямую.
		Если p = 1, то гипербола вырождется в два отрезка прямых:
		   Первый отрезок: (arc1 = 0, y1 = 0), (arc2 = 0, y2 = π) вертикальная прямая из начала координат.
		   Второй отрезок: (arc1 = 0, y1 = π), (arc2 = π, y2 = π) горизональная прямая.
		Написать код на javascript.
		Для визуализации примеров сделать [веб страницу]{@link https://raw.githack.com/anhr/commonNodeJS/master/HyperSphere/Examples/hyperbola.html}, в которой применить библиотеку three.js

		 Функция для вычисления коэффициентов гиперболы по параметру p
		 * </pre>
		 * @param {float} p <pre>Параметр, который меняется в диапазоне от 0 до 1 и который используется для вычисления параметров гиперболы.
		Если p = 0, то гипербола вырождется в прямую.
		Если p = 1, то гипербола вырождется в два отрезка прямых:
		   Первый отрезок: (arc1 = 0, y1 = 0), (arc2 = 0, y2 = π) вертикальная прямая из начала координат.
		   Второй отрезок: (arc1 = 0, y1 = π), (arc2 = π, y2 = π) горизональная прямая.

//        let hyperbola_gpu;
		const calculateHyperbola = (p) => {

/*

*/

/*

*/
				return (arc) => {

					return π;

			// Общий случай: гипербола вида y = a/(x - h) + k
			// У нас есть две точки: (0,0) и (π,π)
			// и дополнительное условие: при x = 0, y = 0
			// при x = π, y = π

			// Из точки (0,0): 0 = a/(0 - h) + k => k = a/h

			// Из точки (π,π): π = a/(π - h) + a/h

			// Вводим параметр p для контроля кривизны
			// Будем использовать p для определения положения асимптоты h
			// При p -> 0: h -> -∞ (гипербола вырождается в прямую)
			// При p -> 1: h -> 0 (гипербола вырождается в вертикальную линию)

			// Свяжем h с p: h = - (1-p)/p * C, где C некоторая константа
			// Чтобы при p=1, h=0; при p=0, h=-∞
			// Возьмем C = π/2 для хорошей визуализации

			return (x) => {

				if (Math.abs(x - h) < 0.001) {

		const cartesianToPolarRandom = (Q) => { return cartesianToPolar({ x: Q[2], y: Q[3], z: Q[1], w: Q[0] }); }

		// 2. Создание ортонормированного базиса в касательном пространстве
		const createTangentBasis = (latitude, longitude, altitude) => {
			const a = altitude, b = Math.PI / 2 - latitude, c = longitude,
				sina = sin(a), cosa = cos(a),
				sinb = sin(b), cosb = cos(b),

			const e1 = [

				cosa * sinb * cosc,
				cosa * sinb * sinc
			];

			//e1.reduce вычисляет сумму квадратов улементов e1
			const norm_e1 = Math.sqrt(e1.reduce((sum, val) => sum + val * val, 0));
			//e1.map создает новый массив путем деления каждого элемента на norm_e1
			const e1_norm = e1.map(v => v / norm_e1);

			const e2_raw = [

				-sina * sinb,

			const e3_raw = [

				0,

		 * @param {any} psi второй угол направления (азимутальный угол)
		 * Назначение:
		 * Определяет азимут направления движения в горизонтальной плоскости касательного пространства

		 * Необходимый и достаточный: 0 ≤ psi < 2π

		const calculateNewPoint = (startingPointParams, distance, eta, psi, R) => {
			// Исходная точка
			const P = startingPointParams.P;

			// Касательный базис

		const setVelocities = (velociti, DAMPING, force) => {

			velociti.x = velociti.x * DAMPING + force.x;
			velociti.y = velociti.y * DAMPING + force.y;
			velociti.z = velociti.z * DAMPING + force.z;
			velociti.w = velociti.w * DAMPING + force.w;

		}
		const setForse = (force, d, dist, m) => { force.x += (d.x / dist) * m; force.y += (d.y / dist) * m; force.z += (d.z / dist) * m; force.w += (d.w / dist) * m; }
		const getD = (p1, p2) => { return { x: p1.x - p2.x, y: p1.y - p2.y, z: p1.z - p2.z, w: p1.w - p2.w } }
		const getD2 = (d) => { return d.x * d.x + d.y * d.y + d.z * d.z + d.w * d.w }
		async function performStepCPU() {
			if (currentStep >= totalSteps) return;
			const prevStart = (currentStep - 1) * pointsPerStep;
			const currStart = currentStep * pointsPerStep;
			const newRadius = radiusPrev + radiusStep;
			const getPoint = (i) => {
				const pointAnglesPrev = angles[prevStart + i];
				const pPrev = polarToCartesian(pointAnglesPrev.latitude, pointAnglesPrev.longitude, pointAnglesPrev.altitude, radiusPrev);
				const pointAngles = cartesianToPolar(pPrev);
				return { angles: pointAngles, p: polarToCartesian(pointAngles.latitude, pointAngles.longitude, pointAngles.altitude, radiusPrev) }
			}

			for (let i = 0; i < pointsPerStep; i++) {
				const point = getPoint(i);
				const angles1 = point.angles;
				const p1 = point.p;
				const force = { x: 0, y: 0, z: 0, w: 0 }

				// Полный перебор для идентичности с шейдером
				for (let j = 0; j < pointsPerStep; j++) {
					if (i === j) continue;
					const point = getPoint(j);
					const angles2 = point.angles;
					const p2 = point.p;
					let d = getD(p1, p2);
					let dist = Math.sqrt(getD2(d));
					const arc = π - hyperbola((dist / radiusPrev / 2) * π);
					const r = radiusPrev;

					// Случайное направление для точки j (может быть противоположным для лучшего разведения)
					const polarNoise2 = GetRandomVertice(arc, angles2);
					const noise2 = polarToCartesian(polarNoise2.latitude, polarNoise2.longitude, polarNoise2.altitude, r);

					// Вектор от i к j
					d = getD(p1, noise2);
					const d2 = getD2(d);
					dist = Math.sqrt(d2);
					if (dist === 0) {
						console.error('performStepCPU: step. Invalid dist = ' + dist);
						return;
					}
					const m = REPULSION_STRENGTH / d2;
					setForse(force, d, dist, m);
				}

				const velociti = velocities[i];
				setVelocities(velociti, DAMPING, force);

				const index = currStart + i;
				const pointCur = { x: p1.x + velociti.x, y: p1.y + velociti.y, z: p1.z + velociti.z, w: p1.w + velociti.w };
				const anglesCur = cartesianToPolar(pointCur);
				angles[index] = anglesCur;
				if (LOG) console.log('Step:' + (parseInt(index / pointsPerStep)) + ' Point:' + index + '. x=' + pointCur.x + ' y=' + pointCur.y + ' z=' + pointCur.z + ' w=' + pointCur.w + ',alt=' + anglesCur.altitude + ' lat=' + anglesCur.latitude + ' lon=' + anglesCur.longitude);
				setAttributes(angles[index], newRadius, index);
			}
			radiusPrev = newRadius; currentStep++;
			posAttr.needsUpdate = true; colorAttr.needsUpdate = true; updateDisplay();
		}

			totalSteps,
			pointsPerStep,

			//totalEnergy: Общая энергия системы (E). Если totalEnergy растет от шага к шагу: Ошибка в знаках сил (точки притягиваются вместо отталкивания) либо слишком большой шаг интегрирования (dt). Энергия totalEnergy уходит в бесконечность или NaN: Ошибка в коде вычислений, при которой две точки заняли абсолютно одинаковые координаты (деление на ноль). Проверьте генератор случайных чисел или начальную инициализацию.
			//meanD: Среднее расстояние до ближайшего соседа. Должно постепенно расти, пока не стабилизируется.
			//variance: Дисперсия(средний квадрат отклонения).Мера того, насколько сильно расстояния до соседей у разных точек "разбросаны" относительно вычисленного среднего значения meanD.
			//stdDev: Среднеквадратичное отклонение (СКО): С каждым шагом алгоритма значение stdDev должно стремиться к нулю.
			//deviationPercent: Коэффициент вариации (дисбаланс). Коэффициент вариации (deviationPercent) высокий (например, > 15-20%): Точки распределены хаотично, решетка не сформировалась. Скорее всего, силам отталкивания не хватает итераций, либо коэффициент затухания скорости (DAMPING) гасит движение слишком рано. deviationPercent стремится к 0% (например, < 2-5%): Алгоритм работает отлично, структура симметрична, точки распределились максимально равномерно.
