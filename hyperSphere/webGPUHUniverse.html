<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPU Hyperspherical Universe - Engine</title>
    <style>
        body {
            background: #000;
            color: #00ffcc;
            font-family: monospace;
            padding: 20px;
            line-height: 1.5;
        }

        .engine-status {
            border: 1px solid #00ffcc;
            padding: 15px;
            width: 450px;
        }

        #log {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }

        #socket-status {
            margin-top: 20px;
            padding: 15px;
            border-left: 4px solid #00ffcc;
            background: #222;
            color: white;
        }
    </style>
</head>
<body>
    <div class="engine-status">
        <h3>ENGINE: averageUniverse</h3>
        <div>STATUS: <span id="status">IDLE</span></div>
        <div>SOURCE: <span id="client">---</span></div>
        <div>PROGRESS: <span id="progress">0 / 0 | R: 0.00</span></div>
        <div id="socket-status">
            <strong>Socket Status:</strong> <span id="stateText">Waiting for connection to server...</span><br>
        </div>
    </div>
    <div id="log"></div>

    <script type="module">
        const socket = new WebSocket('ws://localhost:5000/ws?type=gpu');
        socket.binaryType = 'arraybuffer';

        const stateText = document.getElementById('stateText');

        // 1. Error handling (incorrect address, connection refused)
        socket.onerror = (error) => {
            stateText.innerText = "ERROR: Server unreachable or incorrect address.";
            stateText.style.color = "#ff4444";
            console.error("WebSocket Error:", error);
        };

        // 2. Connection closure handling
        socket.onclose = (event) => {
            if (event.wasClean) {
                stateText.innerText = event.reason ? event.reason : "The connection was closed successfully.";
                if (event.code === 4001) stateText.style.color = "#ff4444";  // Эта страница уже открыта
            } else {
                const rfcLink = "https://datatracker.ietf.org/doc/html/rfc6455#section-7.4.1";
                const mozillaLink = 'https://developer.mozilla.org/en-US/docs/Web/API/CloseEvent/code';
                const errorDetail = event.reason ? `Reason: ${event.reason}` : `Error Code: ${event.code}`;
                const sError = `The connection was closed. ${errorDetail}. See RFC: ${rfcLink}, mozilla: ${mozillaLink}` 
                console.error(sError);

//                if (event.reason) console.log(`Reason: ${event.reason}`);
                stateText.innerText = sError;
                stateText.style.color = "#ff4444";
            }
            console.log(`Close code: ${event.code}, reason: ${event.reason}`);
        };

        // 3. Successful connection
        socket.onopen = () => {
            stateText.innerText = "Connection established. Ready for computation.";
            stateText.style.color = "#00ffcc";
        };

        let device, pipeline, bindGroup;
        let posBuf, velBuf, paramBuf;

        const DAMPING = 0.95;
        const REPULSION_BASE = 50;

        async function initWebGPU() {
            if (!navigator.gpu) return log("WebGPU not supported!");
            const adapter = await navigator.gpu.requestAdapter();
            device = await adapter.requestDevice();
            log("GPU Device Ready");
        }

        socket.onmessage = async (event) => {
            if (typeof event.data === 'string') {
                window.currentConfig = JSON.parse(event.data);
                document.getElementById('status').innerText = "CONFIG RECEIVED";
                document.getElementById('client').innerText = event.origin || "Localhost";
                log("Configuration loaded.");
            } else {
                // Binary data received (Initial 3-Sphere angles)
                const initialAngles = new Float32Array(event.data);
                await runCompute(window.currentConfig, initialAngles);
            }
        };

        async function runCompute(config, initialAngles) {
            log("Starting GPU computation...");
            const { baseRadius, radiusMax, totalSteps, pointsPerStep } = config;
            const count = totalSteps * pointsPerStep;
            const radiusStep = (radiusMax - baseRadius) / (totalSteps - 1);
            const REPULSION_STRENGTH = REPULSION_BASE / pointsPerStep;

            const shaderCode = `
                    struct Params { rPrev: f32, offset: f32 };
                    @group(0) @binding(0) var<storage, read_write> pos: array<vec4<f32>>;
                    @group(0) @binding(1) var<storage, read_write> vel: array<vec4<f32>>;
                    @group(0) @binding(2) var<uniform> params: Params;

                    @compute @workgroup_size(64)
                    fn main(@builtin(global_invocation_id) id: vec3<u32>) {
                        let i = id.x;
                        if (i >= ${pointsPerStep}u) { return; }

                        let prevOff = u32(params.offset - ${pointsPerStep}.0);
                        let currOff = u32(params.offset);

                        var p1 = pos[prevOff + i];
                        var force = vec4<f32>(0.0);

                        for(var j=0u; j < ${pointsPerStep}u; j++) {
                            if(i == j) { continue; }
                            let p2 = pos[prevOff + j];
                            let d = p1 - p2;
                            let dist2 = dot(d, d) + 1e-6;
                            force += (d / sqrt(dist2)) * (${REPULSION_STRENGTH} / dist2);
                        }

                        vel[i] = vel[i] * ${DAMPING} + force;
                        pos[currOff + i] = normalize(p1 + vel[i]) * params.rPrev;
                    }
                `;

            pipeline = device.createComputePipeline({
                layout: 'auto',
                compute: { module: device.createShaderModule({ code: shaderCode }), entryPoint: 'main' }
            });

            posBuf = device.createBuffer({ size: count * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
            velBuf = device.createBuffer({ size: pointsPerStep * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
            paramBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

            const posData = new Float32Array(count * 4);
            // Conversion logic (simplified placeholder for your polarToCartesian)
            for (let i = 0; i < pointsPerStep; i++) {
                posData[i * 4] = baseRadius * Math.sin(initialAngles[i * 3]);
                posData[i * 4 + 3] = baseRadius * Math.cos(initialAngles[i * 3]);
            }
            device.queue.writeBuffer(posBuf, 0, posData);

            bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: { buffer: posBuf } },
                    { binding: 1, resource: { buffer: velBuf } },
                    { binding: 2, resource: { buffer: paramBuf } }
                ]
            });

            let currentR = baseRadius;
            for (let s = 1; s < totalSteps; s++) {
                device.queue.writeBuffer(paramBuf, 0, new Float32Array([currentR, s * pointsPerStep]));

                const encoder = device.createCommandEncoder();
                const pass = encoder.beginComputePass();
                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);
                pass.dispatchWorkgroups(Math.ceil(pointsPerStep / 64));
                pass.end();
                device.queue.submit([encoder.finish()]);

                currentR += radiusStep;

                // Update UI and send progress to client
                document.getElementById('progress').innerText = `${s + 1} / ${totalSteps} | R: ${currentR.toFixed(2)}`;
                socket.send(JSON.stringify({ type: 'UPDATE', step: s + 1, total: totalSteps, r: currentR }));

                await new Promise(r => setTimeout(r, 50));
            }

            log("Computation finished. Data broadcasted.");
            document.getElementById('status').innerText = "DONE";
        }

        function log(m) { document.getElementById('log').innerHTML += `<div>> ${m}</div>`; }
        initWebGPU();
    </script>
</body>
</html>
